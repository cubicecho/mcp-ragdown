<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📚</text></svg>" />
    <title>ragdown</title>
    <!--
      Before first paint, not in React: a theme applied from an effect means one frame of white
      on a dark install. Kept in step with `src/lib/theme.ts`, which owns the key.
    -->
    <script>
      try {
        const t = localStorage.getItem("ragdown.theme") || "system";
        const dark =
          t === "dark" || (t === "system" && matchMedia("(prefers-color-scheme: dark)").matches);
        if (dark) document.documentElement.classList.add("dark");
      } catch (_) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
