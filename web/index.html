<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📚</text></svg>" />
    <title>ragdown</title>
    <!--
      Before first paint, not in React: a theme applied from an effect means one frame of white
      on a dark install. The same rule as cubeui's pre-paint script (controls.md, "Theme"), kept
      in step with `THEME_STORAGE_KEY` in `components/ui/theme-preference-base.ts`. The `if` first
      carries over a choice stored under the key this app used before it moved to cubeui's.
    -->
    <script>
      try {
        const legacy = localStorage.getItem("ragdown.theme");
        if (legacy !== null) {
          if (localStorage.getItem("cubeui-theme") === null)
            localStorage.setItem("cubeui-theme", legacy);
          localStorage.removeItem("ragdown.theme");
        }
        const t = localStorage.getItem("cubeui-theme");
        const dark =
          t === "dark" || (t !== "light" && matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.classList.toggle("dark", dark);
        document.documentElement.classList.toggle("light", t === "light");
      } catch (_) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
