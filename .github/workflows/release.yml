# Tags a release and pushes the image to GHCR and Docker Hub, for amd64 and arm64.
#
# Three jobs: `release` decides whether there is a version to publish, `build`
# builds the image once per architecture on a runner of that architecture, and
# `publish` joins the two under the tags people pull. Each architecture builds
# natively because the image holds native binaries (LanceDB, ONNX Runtime, Node
# itself) and emulating arm64 on an amd64 runner took several times longer.
#
# ghcr.io needs no setup at all: the GITHUB_TOKEN this workflow already has can
# push to it. Docker Hub is optional — set DOCKERHUB_USERNAME (the account that
# owns <user>/mcp-ragdown) and DOCKERHUB_TOKEN (an access token for it, not the
# password) to publish there as well; with neither set those steps are skipped
# and the release still goes out to GHCR.
#
# The organisation shares both, but an organisation secret on the free plan
# reaches public repositories only. A private fork gets them empty, which is the
# case the skip below exists to survive.
#
# Versions come from the commit log, so a release only happens when commits say
# what changed — `feat:` for a minor, `fix:` for a patch, `BREAKING CHANGE:` in
# a body for a major. Anything else releases nothing, which is why the manual
# trigger below exists: it publishes the current main under a version you name,
# without waiting for the history to become conventional.
name: Release

on:
  # Never in parallel with the tests: CI has to have passed on this commit.
  workflow_run:
    workflows: [CI]
    branches: [main]
    types: [completed]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish as, e.g. 0.1.0 (no tag or release notes are created)'
        required: true

# One release at a time, in order: a second run waits rather than cancelling the
# first between its builds and its tags.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  packages: write
  issues: write
  pull-requests: write

jobs:
  release:
    # A red CI run must not become a published image.
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.publish.outputs.go }}
      version: ${{ steps.publish.outputs.version }}
      ref: ${{ steps.publish.outputs.ref }}
    steps:
      - uses: actions/checkout@v7
        with:
          # The commit CI actually tested, not whatever main has drifted to.
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}
          # semantic-release reads the whole log to work out the next version.
          fetch-depth: 0
          # It authenticates with GITHUB_TOKEN itself; the checkout credentials
          # would only shadow that.
          persist-credentials: false

      - name: Semantic release
        id: semantic
        if: github.event_name == 'workflow_run'
        uses: cycjimmy/semantic-release-action@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # One answer for both triggers, so every job below gates on one thing.
      - name: Decide whether to publish
        id: publish
        env:
          DISPATCH_VERSION: ${{ inputs.version }}
          RELEASED: ${{ steps.semantic.outputs.new_release_published }}
          RELEASED_VERSION: ${{ steps.semantic.outputs.new_release_version }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = 'workflow_dispatch' ]; then
            echo "go=true" >> "$GITHUB_OUTPUT"
            echo "version=$DISPATCH_VERSION" >> "$GITHUB_OUTPUT"
            echo "ref=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
          else
            echo "go=$RELEASED" >> "$GITHUB_OUTPUT"
            echo "version=$RELEASED_VERSION" >> "$GITHUB_OUTPUT"
            # The release commit, not the one CI tested: it is that commit plus
            # the version semantic-release wrote into package.json, which the
            # image copies and /api/status reports.
            echo "ref=v$RELEASED_VERSION" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: release
    if: needs.release.outputs.go == 'true'
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    # One output per architecture: each leg of the matrix fills in its own.
    outputs:
      amd64: ${{ steps.digest.outputs.amd64 }}
      arm64: ${{ steps.digest.outputs.arm64 }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release.outputs.ref }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # Worked out in each job rather than handed over by `release`: a job
      # output that happens to contain a secret's value (the Docker Hub
      # username can be the organisation's name) is dropped by the runner.
      # ghcr.io rejects an uppercase path, so the name is lowercased.
      - name: Name the image
        id: image
        run: echo "name=ghcr.io/$(echo "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      # Pushed to GHCR by digest, with no tag: a tag here would point at one
      # architecture until `publish` replaced it.
      - name: Build and push
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          outputs: type=image,name=${{ steps.image.outputs.name }},push-by-digest=true,name-canonical=true,push=true
          # Shares a cache with the CI build of the same Dockerfile and architecture.
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}

      - name: Hand the digest to publish
        id: digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: echo "${{ matrix.arch }}=$DIGEST" >> "$GITHUB_OUTPUT"

  publish:
    needs: [release, build]
    runs-on: ubuntu-latest
    steps:
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Docker Hub is optional, so an absent credential skips it rather than
      # being fatal. Logging in unconditionally turned an empty
      # DOCKERHUB_USERNAME into "Username and password required", which took the
      # image build down with it and left GHCR unpublished on a release that
      # needed no setup at all.
      - name: Work out where the image can go
        id: targets
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          # The same name `build` pushed to; see the note there.
          IMAGE="ghcr.io/$(echo "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"
          {
            echo 'tags<<TAGS_EOF'
            echo "${IMAGE}:latest"
            echo "${IMAGE}:${VERSION}"
            if [ -n "$DOCKERHUB_USERNAME" ]; then
              echo "${DOCKERHUB_USERNAME}/mcp-ragdown:latest"
              echo "${DOCKERHUB_USERNAME}/mcp-ragdown:${VERSION}"
            fi
            echo TAGS_EOF
          } >> "$GITHUB_OUTPUT"

          if [ -n "$DOCKERHUB_USERNAME" ]; then
            echo 'dockerhub=true' >> "$GITHUB_OUTPUT"
          else
            echo 'dockerhub=false' >> "$GITHUB_OUTPUT"
            echo 'DOCKERHUB_USERNAME is not set — publishing to GHCR only.' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Log in to Docker Hub
        if: steps.targets.outputs.dockerhub == 'true'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # Each tag becomes a list of both images, so a pull gets the host's own
      # architecture. The Docker Hub tags are copied from GHCR in the same step.
      - name: Tag both architectures as one image
        env:
          IMAGE: ${{ steps.targets.outputs.image }}
          TAGS: ${{ steps.targets.outputs.tags }}
          AMD64: ${{ needs.build.outputs.amd64 }}
          ARM64: ${{ needs.build.outputs.arm64 }}
        run: |
          if [ -z "$AMD64" ] || [ -z "$ARM64" ]; then
            echo "::error::a build reported no digest (amd64: '$AMD64', arm64: '$ARM64')"
            exit 1
          fi
          args=()
          while IFS= read -r tag; do
            [ -n "$tag" ] && args+=(--tag "$tag")
          done <<< "$TAGS"
          docker buildx imagetools create "${args[@]}" "${IMAGE}@${AMD64}" "${IMAGE}@${ARM64}"
          docker buildx imagetools inspect "${IMAGE}:latest"
