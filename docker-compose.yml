# Point DOCS at a directory of folders (one per top-level directory), set RAGDOWN_TOKEN, and `docker compose up -d`.
services:
  ragdown:
    image: vantreeseba/mcp-ragdown:latest
    # To build from this checkout instead, replace the line above with `build: .`
    # mDNS multicast does not leave Docker's default bridge network. To advertise on the LAN
    # (RAGDOWN_LAN_ADVERTISE=true), use the host's network instead; `ports` then no longer
    # applies, and the server listens on PORT (3000) on the host.
    # network_mode: host
    ports:
      # host:container — change the left side only.
      - '3300:3000'
    volumes:
      # The folders to index. Writable so agents can save documents with ragdown_remember;
      # append `:ro` and set RAGDOWN_READ_ONLY=true to forbid that.
      - ${DOCS:-./docs}:/docs
      # The index. Without it every restart re-embeds the whole folder.
      - ragdown-data:/data
    environment:
      # Bearer token for /mcp/<folder> and the web UI's /api routes (`openssl rand -hex 32`). The server
      # refuses to start with neither this nor SECURE_LOCAL_NET=true.
      RAGDOWN_TOKEN: ${RAGDOWN_TOKEN:-}
      SECURE_LOCAL_NET: ${SECURE_LOCAL_NET:-false}
      RAGDOWN_READ_ONLY: ${RAGDOWN_READ_ONLY:-false}
      RAGDOWN_LAN_ADVERTISE: ${RAGDOWN_LAN_ADVERTISE:-false}
      RAGDOWN_PUBLIC_URL: ${RAGDOWN_PUBLIC_URL:-}
    restart: unless-stopped

volumes:
  ragdown-data:
